name: default_mujoco
scene_xml_path: assets/scene/franka_fr3/scene_default.xml

env_mode: sim_real_time
# env_mode: sim_sim_time
vis_mode: vis_on

# Keep at 1 in SIM_REAL_TIME so each env tick advances sim time by exactly one
# sim_dt and the publish rate matches arm_joint_meas_freq cleanly.
sim_steps_per_control: 1

sim_freq: 1000
view_freq: 30

platform:
  name: franka_fr3
  # Ready pose [0, -pi/4, 0, -3pi/4, 0, pi/2, 0] (joint 7 = 0, as in DROID; the
  # Robotiq is mounted at 0 deg, so it is square to the base here); matches the
  # controller's default_q so the sim starts at the target.
  default_q_values: [0.0, -0.7853982, 0.0, -2.3561945, 0.0, 1.5707963, 0.0]
  default_gripper_width: 0.085
  # The plant does NOT compensate gravity: the controllers send g(q)
  # (plant_gravity_comp: false), as on the FR3 with gravity_model: controller.
  # true = MuJoCo cancels it, like the FR3's own compensation.
  gravity_comp: false
  arm_joint_meas_freq: 1000
  gripper_meas_freq: 100

sub_manager:
  name: franka
  ctrl_channel: franka_arm_joint_ctrl
  gripper_cmd_channel: franka_gripper_cmd
  num_joints: 7
  max_sub_freq: 2000

pub_manager:
  name: franka
  arm_joint_meas_channel: franka_arm_joint_meas
  gripper_joint_meas_channel: franka_gripper_joint_meas
  gripper_state_channel: franka_gripper_state
  max_pub_freq: 2000
