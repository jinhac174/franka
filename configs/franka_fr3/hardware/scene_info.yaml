# Collision geometry for the real robot, stand-alone (run_scene_info.py).
# Normally run_hardware.py publishes it (fr3.yaml scene_info:); use this only
# without run_hardware.py, or after removing that block.
# Describe YOUR cell in this scene: floor, wall_*, table*, obs_* geoms are
# exported. The default scene's walls are placeholders - measure your cell.
scene_xml_path: assets/scene/franka_fr3/scene_real_cell.xml
static_col_info_channel: franka_static_col_info
robot_col_info_channel: franka_robot_col_info
rate: 10.0   # Hz
