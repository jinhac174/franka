name: col_aware_grav_comp
ctrl_freq: 1000
env_mode: sim_real_time

# Pinocchio model: the 7 arm joints (urdf/fr3_robotiq_rigid.urdf: the Robotiq
# gripper is a rigid payload). The gripper goes through the gripper API.
urdf_path: assets/scene/franka_fr3/urdf/fr3_robotiq_rigid.urdf
mesh_path:
  path_1: assets/scene/franka_fr3/urdf

num_joints: 7
num_arm_joints: 7
num_ctrl_joints: 7
default_q_values: [0.0, -0.7853982, 0.0, -2.3561945, 0.0, 1.5707963, 0.0]

# The FR3 (and the sim) compensates gravity itself: no g(q) in tau_ff.
plant_gravity_comp: true
arm_damping: 0.5

# PD gains. Zeroed in the "grav_comp" (free-float) state; applied only when
# repelling from an obstacle.
kp: [200, 200, 200, 200, 60, 60, 20]
kd: [20, 20, 20, 20, 6, 6, 2]
kp_multiplier: [1, 1, 1, 1, 1, 1, 1]
# Below the FR3 limits (2.62 rad/s for joints 1-4, 4.18-5.26 for 5-7).
joint_velocity_limit: [2, 2, 2, 2, 2.5, 2.5, 2.5]

# Repulsive-field tuning: within margin_thr of safty_dist_thr, push away with a
# velocity that grows to repulsive_coeff as the margin -> 0. Below safty_dist_thr
# the controller stops (state="collision").
safty_dist_thr: 0.02
magin_thr: 0.08
repulsive_coeff: 8

# Robot collision primitives to check (names from the env's robot_col_info;
# "<link>__2" is a second primitive on the same link frame).
col_link_names: ["fr3_link2", "fr3_link3", "fr3_link4", "fr3_link5", "fr3_link5__2",
                 "fr3_link6", "fr3_link7", "fr3_link7__2", "fr3_gripper", "fr3_gripper__2"]
# Static obstacle names (must match the env's static_col_info geoms = MJCF walls).
obs_names: ["floor", "wall_back", "wall_left"]
# link <-> obstacle pairs to distance-check each plan tick. fr3_link2 sits at
# shoulder height and cannot reach the floor.
col_pairs:
  - ["fr3_link2", "wall_back"]
  - ["fr3_link2", "wall_left"]
  - ["fr3_link3", "wall_back"]
  - ["fr3_link3", "wall_left"]
  - ["fr3_link3", "floor"]
  - ["fr3_link4", "wall_back"]
  - ["fr3_link4", "wall_left"]
  - ["fr3_link4", "floor"]
  - ["fr3_link5", "wall_back"]
  - ["fr3_link5", "wall_left"]
  - ["fr3_link5", "floor"]
  - ["fr3_link5__2", "wall_back"]
  - ["fr3_link5__2", "wall_left"]
  - ["fr3_link5__2", "floor"]
  - ["fr3_link6", "wall_back"]
  - ["fr3_link6", "wall_left"]
  - ["fr3_link6", "floor"]
  - ["fr3_link7", "wall_back"]
  - ["fr3_link7", "wall_left"]
  - ["fr3_link7", "floor"]
  - ["fr3_link7__2", "wall_back"]
  - ["fr3_link7__2", "wall_left"]
  - ["fr3_link7__2", "floor"]
  - ["fr3_gripper", "wall_back"]
  - ["fr3_gripper", "wall_left"]
  - ["fr3_gripper", "floor"]
  - ["fr3_gripper__2", "wall_back"]
  - ["fr3_gripper__2", "wall_left"]
  - ["fr3_gripper__2", "floor"]

plan_freq: 100
plan_horizon: 0.1

dict_joints:
  arm:
    joint_meas_channel: franka_arm_joint_meas
    list_joint_idx: [0, 1, 2, 3, 4, 5, 6]

sub_manager:
  name: franka
  arm_joint_meas_channel: franka_arm_joint_meas
  static_col_info_channel: franka_static_col_info
  robot_col_info_channel: franka_robot_col_info

pub_manager:
  name: joint_ctrl
  ctrl_channel: franka_arm_joint_ctrl
  gripper_cmd_channel: franka_gripper_cmd

print_period: 1.0
