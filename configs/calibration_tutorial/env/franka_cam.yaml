name: mujoco_cam
scene_xml_path: assets/scene/franka_fr3/scene_cam_calib.xml

env_mode: sim_real_time
vis_mode: vis_on

sim_steps_per_control: 1
sim_freq: 1000
view_freq: 30

viewer_cam:
  distance: 1.8
  elevation: -25
  azimuth: 50
  lookat: [0.3, 0.1, 0.35]

platform:
  name: franka_fr3
  default_q_values: [0.0, 0.0, 0.0, -1.5707963, 0.0, 1.5707963, 0.0]
  default_gripper_width: 0.085
  # The plant does NOT compensate gravity: the controllers send g(q)
  # (plant_gravity_comp: false), as on the FR3 with gravity_model: controller.
  gravity_comp: false
  arm_joint_meas_freq: 200
  gripper_meas_freq: 100

sensor:
  extrinsic:
    calib_camera:
      width: 640
      height: 480
      rgb_enable: True
      depth_enable: True
      frequency: 15
      fixed: True
      attached_body: world
      depth_factor: 1.0

sub_manager:
  name: franka
  ctrl_channel: franka_arm_joint_ctrl
  gripper_cmd_channel: franka_gripper_cmd
  num_joints: 7
  max_sub_freq: 2000

pub_manager:
  name: franka
  arm_joint_meas_channel: franka_arm_joint_meas
  gripper_joint_meas_channel: franka_gripper_joint_meas
  gripper_state_channel: franka_gripper_state
  camera_channels: [calib_camera]
  max_pub_freq: 2000
