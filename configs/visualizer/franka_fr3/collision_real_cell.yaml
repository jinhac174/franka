# Viser for the real (DROID) cell: virtual floor / front / left walls.
name: franka_fr3
vis_freq: 30

franka_fr3:
  arm_joint_meas_channel: franka_arm_joint_meas
  gripper_joint_meas_channel: franka_gripper_joint_meas
  num_arm_joints: 7
  num_gripper_joints: 1   # the Robotiq driver angle

  urdf_path: assets/scene/franka_fr3/urdf/fr3_robotiq.urdf
  mesh_dir: ""

  # Static furniture of the cell, drawn as-is (visual only): the enclosure
  # from RoPhiTutorial (Rizon4_viser.urdf "enclosure"), at the same place
  # relative to the robot base.
  scene_meshes:
    - name: enclosure
      path: assets/scene/franka_fr3/meshes/cell/enclosure_decimated.STL
      scale: 0.001
      xyz: [-0.293, 0.482, -0.091]
      rpy: [1.57, 0.0, 0.0]
      color: [200, 200, 205]

  # Collision-info channels for the "Show collision geometry" overlay and the
  # "Show collision distances" dashed lines. Subscribed off the wire so they
  # match EXACTLY what the collision-aware controller receives.
  robot_col_info_channel: franka_robot_col_info
  static_col_info_channel: franka_static_col_info

  # Draw dashed nearest-point lines when FCL distance < this threshold (m).
  # Red = robot <-> environment; orange = self-collision.
  col_dist_thr: 0.08
  # Draw the virtual walls / floor from the start ("Show walls" checkbox).
  show_walls: true
  # Nearest-point lines + cm labels from the start ("Show collision distances").
  show_distances: true

  # link <-> obstacle pairs (same set as col_aware_real_cell).
  col_pairs:
    - ["fr3_link2", "wall_front"]
    - ["fr3_link2", "wall_left"]
    - ["fr3_link3", "wall_front"]
    - ["fr3_link3", "wall_left"]
    - ["fr3_link3", "floor"]
    - ["fr3_link4", "wall_front"]
    - ["fr3_link4", "wall_left"]
    - ["fr3_link4", "floor"]
    - ["fr3_link5", "wall_front"]
    - ["fr3_link5", "wall_left"]
    - ["fr3_link5", "floor"]
    - ["fr3_link5__2", "wall_front"]
    - ["fr3_link5__2", "wall_left"]
    - ["fr3_link5__2", "floor"]
    - ["fr3_link6", "wall_front"]
    - ["fr3_link6", "wall_left"]
    - ["fr3_link6", "floor"]
    - ["fr3_link7", "wall_front"]
    - ["fr3_link7", "wall_left"]
    - ["fr3_link7", "floor"]
    - ["fr3_link7__2", "wall_front"]
    - ["fr3_link7__2", "wall_left"]
    - ["fr3_link7__2", "floor"]
    - ["fr3_gripper", "wall_front"]
    - ["fr3_gripper", "wall_left"]
    - ["fr3_gripper", "floor"]
    - ["fr3_gripper__2", "wall_front"]
    - ["fr3_gripper__2", "wall_left"]
    - ["fr3_gripper__2", "floor"]

  # Self-collision pairs: the ones Franka's SRDF leaves enabled (all other
  # link pairs are adjacent or can never touch).
  self_col_pairs:
    - ["fr3_link5", "fr3_link0"]
    - ["fr3_link5__2", "fr3_link0"]
    - ["fr3_link6", "fr3_link0"]
    - ["fr3_link7", "fr3_link0"]
    - ["fr3_link7__2", "fr3_link0"]
    - ["fr3_gripper__2", "fr3_link0"]
    - ["fr3_gripper", "fr3_link0"]
    - ["fr3_link5", "fr3_link1"]
    - ["fr3_link5__2", "fr3_link1"]
    - ["fr3_link6", "fr3_link1"]
    - ["fr3_link7", "fr3_link1"]
    - ["fr3_link7__2", "fr3_link1"]
    - ["fr3_gripper__2", "fr3_link1"]
    - ["fr3_gripper", "fr3_link1"]
    - ["fr3_link5", "fr3_link2"]
    - ["fr3_link5__2", "fr3_link2"]
    - ["fr3_link7", "fr3_link2"]
    - ["fr3_link7__2", "fr3_link2"]
    - ["fr3_gripper__2", "fr3_link2"]
    - ["fr3_gripper", "fr3_link2"]
    - ["fr3_gripper__2", "fr3_link5"]
    - ["fr3_gripper", "fr3_link5"]
    - ["fr3_gripper__2", "fr3_link5__2"]
    - ["fr3_gripper", "fr3_link5__2"]
